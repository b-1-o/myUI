name: Deploy myUI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh GitHub works catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-works.mjs

      - name: Fetch React Bits components
        run: |
          mkdir -p src/components
          BASE_COMP="https://cdn.jsdelivr.net/gh/DavidHDev/react-bits@main/src/content/Components"
          BASE_BG="https://cdn.jsdelivr.net/gh/DavidHDev/react-bits@main/src/content/Backgrounds"
          curl -fsSL "$BASE_COMP/CircularCarousel/CircularCarousel.jsx" -o src/components/CircularCarousel.jsx
          curl -fsSL "$BASE_COMP/CircularCarousel/CircularCarousel.css" -o src/components/CircularCarousel.css
          curl -fsSL "$BASE_COMP/OptionWheel/OptionWheel.jsx" -o src/components/OptionWheel.jsx
          curl -fsSL "$BASE_COMP/OptionWheel/OptionWheel.css" -o src/components/OptionWheel.css
          curl -fsSL "$BASE_COMP/InfiniteMenu/InfiniteMenu.jsx" -o src/components/InfiniteMenu.jsx
          curl -fsSL "$BASE_COMP/InfiniteMenu/InfiniteMenu.css" -o src/components/InfiniteMenu.css
          curl -fsSL "$BASE_BG/Dither/Dither.jsx" -o src/components/Dither.jsx
          curl -fsSL "$BASE_BG/Dither/Dither.css" -o src/components/Dither.css
          python3 scripts/patch-infinite-menu.py
          python3 scripts/patch-option-wheel.py
          python3 scripts/patch-dither.py
          sed -i 's/object-fit: cover;/object-fit: cover; filter: grayscale(1) contrast(1.06);/' src/components/CircularCarousel.css || true

      - name: Install dependencies
        run: npm install

      - name: Stage public assets
        run: |
          mkdir -p public/works public/icons
          if [ -d assets ]; then
            cp -f assets/*.png public/works/ 2>/dev/null || true
            cp -f assets/back.png public/back.png 2>/dev/null || true
          fi

      - name: Build
        run: npm run build

      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
